[project]
name = "luau"
version = "0.1.0"
type = "library"
license = "Apache-2.0 AND MIT"
description = "Luau scripts in a FutureBlitz program: a typed API, sandboxed, with functions and types both ways."
readme = "README.md"
repository = "https://github.com/hlpdev/fb-luau"
keywords = ["luau", "lua", "scripting", "sandbox", "modding"]
fb = ">=1.3.2"

# The package's library, luau_native, with Luau in it, built for each target into native/<target>/.
[native]
luau_native = { dynamic = "native/{target}/luau_native" }
