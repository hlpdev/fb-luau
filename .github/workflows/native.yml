name: Native

# Each target's library, built as a release's is, Linux's in a manylinux_2_28 container (AlmaLinux
# 8), so it runs on glibc 2.28 as the programs fb builds do, and Windows's by MSYS2's UCRT64 GCC,
# whose C++ library is built for the UCRT, as fb's programs are. The C++ tests run on each, on the
# Release build, then the export check. Each target's library is an artifact, native-<target>, a
# tar of luau/native/<target>/, which CI's tests and publishing unpack into the package.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            shell: msys2 {0}
            configure: -G Ninja
          - target: linux-x64
            os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            shell: bash
          - target: linux-arm64
            os: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            shell: bash
          - target: macos-arm64
            os: macos-15
            shell: bash
          - target: macos-x64
            os: macos-15-intel
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW (UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # Four jobs, as the runners have four cores: --parallel alone is make -j with no bound, and
      # Luau's Analysis holds a gigabyte a compile.
      - name: Build
        run: |
          cmake -S . -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DFBL_FB_TESTS=OFF
          cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the exports
        run: |
          libraries=""
          for library in luau/native/${{ matrix.target }}/*luau_native.*; do
            case "$library" in *.dll.a) ;; *) libraries="$libraries $library" ;; esac
          done
          sh tools/check-exports.sh fbl_ $libraries
          tar -cf native-${{ matrix.target }}.tar luau/native/${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: native-${{ matrix.target }}.tar
          if-no-files-found: error
